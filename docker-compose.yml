services:
  api:
    build: .
    ports:
      - '3000:3000'
    depends_on:
      - postgres
    environment:
      - POSTGRES_USER=recipe
      - POSTGRES_PASSWORD=RecipePassword
      - NODE_ENV=development
    volumes:
      - .:/app
      - ./logs:/app/logs
    command: ['npm', 'run', 'start:dev']

  postgres:
    image: postgres:13.5
    restart: always
    environment:
      - POSTGRES_USER=recipe
      - POSTGRES_PASSWORD=RecipePassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

volumes:
  postgres_data:
